<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有機煉金術師：官能基大躍遷 (HKDSE Chemistry)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom Scrollbar for Reagents Area */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SYNTHESIZED AUDIO EFFECTS ---
    const createSoundEffects = () => {
      let ctx = null;
      const getCtx = () => {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        return ctx;
      };

      return {
        muted: false,
        playClick() {
          if (this.muted) return;
          try {
            const audioCtx = getCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
          } catch (e) {}
        },
        playSuccess() {
          if (this.muted) return;
          try {
            const audioCtx = getCtx();
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);
              gain.gain.setValueAtTime(0.15, now + idx * 0.08);
              gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.2);
            });
          } catch (e) {}
        },
        playError() {
          if (this.muted) return;
          try {
            const audioCtx = getCtx();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch (e) {}
        }
      };
    };

    const sounds = createSoundEffects();

    // --- DATA STRUCTURES (DSE CURRICULUM) ---
    const MOLECULES = {
      PROPANE: { name: '丙烷 (Propane)', formula: 'CH₃CH₂CH₃', class: '烷烴 Alkane' },
      BROMOPROPANE_1: { name: '1-溴丙烷 (1-Bromopropane)', formula: 'CH₃CH₂CH₂Br', class: '鹵烷 Haloalkane' },
      PROPAN_1_OL: { name: '丙-1-醇 (Propan-1-ol)', formula: 'CH₃CH₂CH₂OH', class: '1° 醇 Primary Alcohol' },
      PROPANOIC_ACID: { name: '丙酸 (Propanoic acid)', formula: 'CH₃CH₂COOH', class: '羧酸 Carboxylic acid' },
      PROPENE: { name: '丙烯 (Propene)', formula: 'CH₃CH=CH₂', class: '烯烴 Alkene' },
      ETHYL_PROPANOATE: { name: '丙酸乙酯 (Ethyl propanoate)', formula: 'CH₃CH₂COOCH₂CH₃', class: '酯 Ester' }
    };

    const REAGENTS = [
      { id: 'r_br2_uv', label: 'Br₂ (在有機溶劑中), 紫外光 / UV light', type: 'sub' },
      { id: 'r_oh_aq', label: 'NaOH(aq) / OH⁻(aq), 加熱 (Heat)', type: 'sub' },
      { id: 'r_h2so4_conc', label: '濃 H₂SO₄ (Conc. H₂SO₄), 加熱', type: 'elim' },
      { id: 'r_hbr', label: 'HBr(g) / HX', type: 'add' },
      { id: 'r_h2_ni', label: 'H₂, Ni / Pt 催化劑, 加熱', type: 'add' },
      { id: 'r_ox_distill', label: 'Cr₂O₇²⁻/H⁺(aq), 加熱並即時蒸餾', type: 'ox' },
      { id: 'r_ox_reflux', label: 'Cr₂O₇²⁻/H⁺(aq), 回流加熱 (Reflux)', type: 'ox' },
      { id: 'r_nabh4', label: 'NaBH₄(aq) 水溶液', type: 'red' },
      { id: 'r_lialh4', label: '1. LiAlH₄ (乾燥醚) 2. H⁺(aq)', type: 'red' },
      { id: 'r_esterification', label: 'CH₃CH₂OH (乙醇) + 濃 H₂SO₄, 加熱', type: 'ester' }
    ];

    const REACTION_TYPES = [
      { id: 'sub', name: '取代反應 (Substitution)' },
      { id: 'add', name: '加成反應 (Addition)' },
      { id: 'elim', name: '消去/脫水反應 (Elimination)' },
      { id: 'ox', name: '氧化反應 (Oxidation)' },
      { id: 'red', name: '還原反應 (Reduction)' },
      { id: 'ester', name: '酯化反應 (Esterification)' }
    ];

    const CHALLENGES = [
      {
        id: 1,
        title: '關卡 1：經典單步官能基氧化',
        start: MOLECULES.PROPAN_1_OL,
        target: MOLECULES.PROPANOIC_ACID,
        stepsNeeded: 1,
        hint: '從 1° 醇直接一步氧化為羧酸，需要選擇強氧化劑以及適當的加熱條件（回流）。',
        validTransitions: [
          {
            from: MOLECULES.PROPAN_1_OL,
            reagentId: 'r_ox_reflux',
            typeId: 'ox',
            next: MOLECULES.PROPANOIC_ACID,
            explanation: '1° 醇在酸化重鉻酸鉀 (Cr₂O₇²⁻/H⁺) 回流加熱條件下被完全氧化為羧酸。'
          }
        ],
        fullSolutionSteps: [
          {
            step: 1,
            from: MOLECULES.PROPAN_1_OL,
            reagent: 'Cr₂O₇²⁻/H⁺(aq), 回流加熱 (Reflux)',
            type: '氧化反應 (Oxidation)',
            to: MOLECULES.PROPANOIC_ACID,
            note: '酸化重鉻酸鉀回流加熱可將一級醇完全氧化成羧酸。'
          }
        ]
      },
      {
        id: 2,
        title: '關卡 2：兩步路徑合成（烷烴到一級醇）',
        start: MOLECULES.PROPANE,
        target: MOLECULES.PROPAN_1_OL,
        stepsNeeded: 2,
        hint: '步驟一：烷烴需在紫外光下與 Br₂ 發生取代反應生成鹵烷；步驟二：鹵烷與 OH⁻(aq) 加熱發生取代水解。',
        validTransitions: [
          {
            from: MOLECULES.PROPANE,
            reagentId: 'r_br2_uv',
            typeId: 'sub',
            next: MOLECULES.BROMOPROPANE_1,
            explanation: '步驟 1 成功：丙烷與 Br₂ 在紫外光下發生自由基取代反應生成 1-溴丙烷！'
          },
          {
            from: MOLECULES.BROMOPROPANE_1,
            reagentId: 'r_oh_aq',
            typeId: 'sub',
            next: MOLECULES.PROPAN_1_OL,
            explanation: '步驟 2 成功：1-溴丙烷與水解試劑 OH⁻(aq) 加熱發生親核取代反應生成 丙-1-醇！'
          }
        ],
        fullSolutionSteps: [
          {
            step: 1,
            from: MOLECULES.PROPANE,
            reagent: 'Br₂ (在有機溶劑中), 紫外光 / UV light',
            type: '取代反應 (Substitution)',
            to: MOLECULES.BROMOPROPANE_1,
            note: '自由基取代反應生成鹵烷中間體。'
          },
          {
            step: 2,
            from: MOLECULES.BROMOPROPANE_1,
            reagent: 'NaOH(aq) / OH⁻(aq), 加熱 (Heat)',
            type: '取代反應 (Substitution)',
            to: MOLECULES.PROPAN_1_OL,
            note: '鹵烷水解生成醇。'
          }
        ]
      },
      {
        id: 3,
        title: '關卡 3：多階段路徑（烯烴轉化為酯）',
        start: MOLECULES.PROPENE,
        target: MOLECULES.ETHYL_PROPANOATE,
        stepsNeeded: 4,
        hint: '加成 (HBr) ➔ 水解取代 (OH⁻) ➔ 氧化 (Cr₂O₇²⁻/H⁺ 回流) ➔ 酯化 (濃 H₂SO₄ 加熱)。',
        validTransitions: [
          {
            from: MOLECULES.PROPENE,
            reagentId: 'r_hbr',
            typeId: 'add',
            next: MOLECULES.BROMOPROPANE_1,
            explanation: '步驟 1 成功：丙烯與 HBr 發生加成反應生成 1-溴丙烷。'
          },
          {
            from: MOLECULES.BROMOPROPANE_1,
            reagentId: 'r_oh_aq',
            typeId: 'sub',
            next: MOLECULES.PROPAN_1_OL,
            explanation: '步驟 2 成功：1-溴丙烷水解生成 丙-1-醇。'
          },
          {
            from: MOLECULES.PROPAN_1_OL,
            reagentId: 'r_ox_reflux',
            typeId: 'ox',
            next: MOLECULES.PROPANOIC_ACID,
            explanation: '步驟 3 成功：丙-1-醇完全氧化生成 丙酸。'
          },
          {
            from: MOLECULES.PROPANOIC_ACID,
            reagentId: 'r_esterification',
            typeId: 'ester',
            next: MOLECULES.ETHYL_PROPANOATE,
            explanation: '步驟 4 成功：丙酸與乙醇在濃硫酸加熱催化下進行酯化反應，生成丙酸乙酯！'
          }
        ],
        fullSolutionSteps: [
          { step: 1, from: MOLECULES.PROPENE, reagent: 'HBr(g) / HX', type: '加成反應 (Addition)', to: MOLECULES.BROMOPROPANE_1, note: '烯烴加成。' },
          { step: 2, from: MOLECULES.BROMOPROPANE_1, reagent: 'NaOH(aq) / OH⁻(aq), 加熱', type: '取代反應 (Substitution)', to: MOLECULES.PROPAN_1_OL, note: '水解生成一級醇。' },
          { step: 3, from: MOLECULES.PROPAN_1_OL, reagent: 'Cr₂O₇²⁻/H⁺(aq), 回流加熱', type: '氧化反應 (Oxidation)', to: MOLECULES.PROPANOIC_ACID, note: '完全氧化成羧酸。' },
          { step: 4, from: MOLECULES.PROPANOIC_ACID, reagent: 'CH₃CH₂OH + 濃 H₂SO₄, 加熱', type: '酯化反應 (Esterification)', to: MOLECULES.ETHYL_PROPANOATE, note: '生成酯化合物。' }
        ]
      },
      {
        id: 4,
        title: '關卡 4：HKDSE 陷阱關卡（還原劑限制）',
        start: MOLECULES.PROPANOIC_ACID,
        target: MOLECULES.PROPAN_1_OL,
        stepsNeeded: 1,
        hint: '注意！羧酸無法被普通的 NaBH₄ 還原！必須選用強還原劑 LiAlH₄ (在無水醚中)。',
        isTrap: true,
        validTransitions: [
          {
            from: MOLECULES.PROPANOIC_ACID,
            reagentId: 'r_lialh4',
            typeId: 'red',
            next: MOLECULES.PROPAN_1_OL,
            explanation: '正確！羧酸只有強還原劑 LiAlH₄ 能將其還原為 1° 醇。'
          }
        ],
        fullSolutionSteps: [
          {
            step: 1,
            from: MOLECULES.PROPANOIC_ACID,
            reagent: '1. LiAlH₄ (乾燥醚) 2. H⁺(aq)',
            type: '還原反應 (Reduction)',
            to: MOLECULES.PROPAN_1_OL,
            note: '⚠️ NaBH₄ 能力不足，只有 LiAlH₄ 才能還原羧酸成一級醇。'
          }
        ]
      }
    ];

    const CHEAT_SHEET_DATA = [
      {
        group: '1. 烷烴 Alkane',
        reactions: [
          { from: '烷烴', to: '鹵烷', reagent: 'X₂ (Cl₂/Br₂), 紫外光 / UV light', type: '取代反應 (Substitution)', note: '自由基取代反應' }
        ]
      },
      {
        group: '2. 烯烴 Alkene',
        reactions: [
          { from: '烯烴', to: '烷烴', reagent: 'H₂, Pt / Ni 催化劑', type: '加成反應 (Addition)', note: '加氫反應' },
          { from: '烯烴', to: '鹵烷', reagent: 'HX (如 HBr)', type: '加成反應 (Addition)', note: '遵從馬氏規則 (Markovnikov rule)' }
        ]
      },
      {
        group: '3. 醇 Alcohol (1°, 2°, 3°)',
        reactions: [
          { from: '1° 醇', to: '醛', reagent: 'Cr₂O₇²⁻/H⁺(aq), 加熱即時蒸餾', type: '氧化反應 (Oxidation)', note: '防止被繼續氧化' },
          { from: '1° 醇 / 醛', to: '羧酸', reagent: 'Cr₂O₇²⁻/H⁺(aq), 回流加熱 (Reflux)', type: '氧化反應 (Oxidation)', note: '完全氧化' }
        ]
      },
      {
        group: '4. 羰基化合物 (醛/酮/羧酸)',
        reactions: [
          { from: '羧酸', to: '1° 醇', reagent: '1. LiAlH₄ (乾燥醚) 2. H⁺', type: '還原反應 (Reduction)', note: '⚠️ NaBH₄ 能力不足！' },
          { from: '羧酸 + 醇', to: '酯', reagent: '濃 H₂SO₄, 加熱', type: '酯化反應 (Esterification)', note: '可逆反應，甜香味' }
        ]
      }
    ];

    function App() {
      const [gameState, setGameState] = useState('menu');
      const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [timeLeft, setTimeLeft] = useState(45);
      const [soundMuted, setSoundMuted] = useState(false);
      const [showCheatSheet, setShowCheatSheet] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [failedReason, setFailedReason] = useState('');

      const [currentMolecule, setCurrentMolecule] = useState(null);
      const [selectedReagent, setSelectedReagent] = useState(null);
      const [selectedReactionType, setSelectedReactionType] = useState(null);
      const [reactionHistory, setReactionHistory] = useState([]);
      const [feedback, setFeedback] = useState(null);

      const currentLevel = CHALLENGES[currentLevelIdx];
      const timerRef = useRef(null);

      const toggleSound = () => {
        sounds.muted = !soundMuted;
        setSoundMuted(!soundMuted);
      };

      useEffect(() => {
        if (gameState === 'playing' && timeLeft > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                setGameState('gameover');
                setFailedReason('時間耗盡！反應過程超過限時。');
                sounds.playError();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [gameState, timeLeft]);

      const startGame = () => {
        sounds.playClick();
        setGameState('playing');
        setCurrentLevelIdx(0);
        setScore(0);
        setCombo(0);
        setFailedReason('');
        loadLevel(0);
      };

      const loadLevel = (index) => {
        const lvl = CHALLENGES[index];
        setCurrentMolecule(lvl.start);
        setReactionHistory([lvl.start]);
        setSelectedReagent(null);
        setSelectedReactionType(null);
        setFeedback(null);
        setShowHint(false);
        setTimeLeft(50);
      };

      const triggerGameOver = (reason) => {
        sounds.playError();
        setFailedReason(reason);
        setGameState('gameover');
      };

      const handleExecuteReaction = () => {
        sounds.playClick();
        if (!selectedReagent || !selectedReactionType) {
          setFeedback({
            type: 'warning',
            title: '缺少步驟！',
            msg: '請同時選擇「反應試劑及條件」與「反應類別」。'
          });
          return;
        }

        if (currentMolecule.class.includes('3° Alcohol') || currentLevel.isTrap) {
          if (selectedReactionType === 'ox') {
            setCombo(0);
            triggerGameOver('觸發「三級醇防禦」陷阱！3° 醇上連接 -OH 的碳原子沒有氫原子 (C-H 鍵)，因此無法被氧化！');
            return;
          }
        }

        const transition = currentLevel.validTransitions.find(
          t => t.from.name === currentMolecule.name &&
               t.reagentId === selectedReagent.id &&
               t.typeId === selectedReactionType
        );

        if (transition) {
          sounds.playSuccess();
          const nextMol = transition.next;
          const newHistory = [...reactionHistory, nextMol];
          setReactionHistory(newHistory);
          setCurrentMolecule(nextMol);

          const addScore = 150 + combo * 50;
          setScore(prev => prev + addScore);
          setCombo(prev => prev + 1);

          setSelectedReagent(null);
          setSelectedReactionType(null);

          if (nextMol.name === currentLevel.target.name) {
            setFeedback({
              type: 'level_complete',
              title: '🎉 關卡完成！',
              msg: `成功合成終點產物：${nextMol.name}！`
            });

            setTimeout(() => {
              if (currentLevelIdx + 1 < CHALLENGES.length) {
                setCurrentLevelIdx(prev => prev + 1);
                loadLevel(currentLevelIdx + 1);
              } else {
                setGameState('victory');
                sounds.playSuccess();
              }
            }, 1400);
          } else {
            const stepIndex = newHistory.length - 1;
            setFeedback({
              type: 'success',
              title: `🧪 第 ${stepIndex} 步反應成功！生成中間體：${nextMol.name}`,
              msg: `${transition.explanation} 請繼續選擇下一個反應步驟！`
            });
          }
        } else {
          setCombo(0);
          let customError = '反應條件與基質不配對，無法生成預期的目標官能基。';
          if (currentMolecule.class.includes('Carboxylic acid') && selectedReagent.id === 'r_nabh4') {
            customError = '⚠️ HKDSE 考點陷阱：NaBH₄ 的還原能力較弱，無法還原羧酸！請選用強還原劑 LiAlH₄。';
          }
          triggerGameOver(customError);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">
          
          {/* HEADER */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 py-3 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2 rounded-xl text-slate-950 font-bold text-lg">
                  🧪
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-wide bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                    有機煉金術師：官能基大躍遷
                  </h1>
                  <p className="text-xs text-slate-400 hidden sm:block">HKDSE 化學科 · 官能基轉換與多步合成大挑戰</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setShowCheatSheet(true)}
                  className="flex items-center space-x-1 text-xs sm:text-sm bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30 px-3 py-1.5 rounded-lg transition-all"
                >
                  📖 <span>反應秘笈</span>
                </button>

                <button
                  onClick={toggleSound}
                  className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors"
                >
                  {soundMuted ? '🔇' : '🔊'}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col">
            
            {/* MENU */}
            {gameState === 'menu' && (
              <div className="my-auto flex flex-col items-center text-center space-y-6 max-w-2xl mx-auto py-8">
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-3xl text-5xl">
                  ⚗️
                </div>

                <div className="space-y-3">
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-white">
                    掌握 HKDSE 有機合成邏輯
                  </h2>
                  <p className="text-slate-400 text-sm sm:text-base leading-relaxed">
                    透過選擇精確的「試劑與條件」與「反應類別」，進行單步及多步合成！答對中間步驟將提供即時提示，答錯會提供完整標準答案拆解。
                  </p>
                </div>

                <button
                  onClick={startGame}
                  className="px-8 py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-lg rounded-xl shadow-lg transition-all"
                >
                  ▶ 開始化學實驗大挑戰
                </button>
              </div>
            )}

            {/* PLAYING */}
            {gameState === 'playing' && currentLevel && (
              <div className="space-y-4">
                
                {/* DASHBOARD */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
                    <div className="text-xs text-slate-400">當前關卡</div>
                    <div className="text-sm font-bold text-slate-200">{currentLevel.title}</div>
                  </div>

                  <div className="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
                    <div className="text-xs text-slate-400">剩餘時間</div>
                    <div className={`text-lg font-mono font-bold ${timeLeft <= 10 ? 'text-red-400 animate-pulse' : 'text-amber-400'}`}>
                      {timeLeft}s
                    </div>
                  </div>

                  <div className="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
                    <div className="text-xs text-slate-400">得分 (Score)</div>
                    <div className="text-lg font-bold text-emerald-400 font-mono">{score}</div>
                  </div>

                  <div className="bg-slate-900/80 border border-teal-500/30 p-3 rounded-xl bg-teal-950/20">
                    <div className="text-xs text-teal-400 font-medium">合成目標 Target</div>
                    <div className="text-sm font-bold text-white truncate">{currentLevel.target.name}</div>
                  </div>
                </div>

                {/* SYNTHETIC ROADMAP */}
                <div className="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl relative overflow-x-auto">
                  <div className="text-xs text-slate-400 mb-2 flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <span>合成路徑圖 (Synthetic Route Roadmap)</span>
                      {reactionHistory.length > 1 && (
                        <span className="bg-emerald-950 text-emerald-300 border border-emerald-800/40 text-[11px] px-2 py-0.5 rounded-full font-mono">
                          已完成第 {reactionHistory.length - 1} / {currentLevel.stepsNeeded} 步
                        </span>
                      )}
                    </div>
                    
                    <button
                      onClick={() => setShowHint(!showHint)}
                      className="text-xs text-amber-400 hover:text-amber-300 bg-amber-950/40 border border-amber-500/30 px-2.5 py-1 rounded-lg"
                    >
                      💡 {showHint ? '隱藏提示' : '顯示導師提示'}
                    </button>
                  </div>

                  {showHint && (
                    <div className="mb-3 p-3 bg-amber-950/30 border border-amber-500/40 rounded-xl text-xs text-amber-200">
                      <span className="font-bold text-amber-300">💡 導師提示：</span>{currentLevel.hint}
                    </div>
                  )}
                  
                  <div className="flex items-center space-x-3 min-w-max py-2">
                    {reactionHistory.map((mol, idx) => (
                      <div key={idx} className="flex items-center space-x-3">
                        <div className={`p-3 rounded-xl border flex flex-col items-center min-w-[140px] ${
                          idx === reactionHistory.length - 1 
                            ? 'bg-slate-800 border-emerald-500 ring-2 ring-emerald-500/20' 
                            : 'bg-slate-900/60 border-slate-700 opacity-75'
                        }`}>
                          <div className="text-xs text-emerald-400 font-medium mb-1">
                            {idx === 0 ? '起點 Starting' : idx === currentLevel.stepsNeeded ? '終點 Target' : `中間體 Step ${idx}`}
                          </div>
                          <div className="font-bold text-slate-100 text-sm">{mol.name.split(' ')[0]}</div>
                          <div className="font-mono text-xs text-slate-400 mt-0.5">{mol.formula}</div>
                        </div>

                        {idx < reactionHistory.length - 1 && (
                          <span className="text-emerald-400 font-bold">➔</span>
                        )}
                      </div>
                    ))}

                    {currentMolecule.name !== currentLevel.target.name && (
                      <div className="flex items-center space-x-3">
                        <span className="text-slate-600 font-bold animate-pulse">➔</span>
                        <div className="p-3 rounded-xl border border-dashed border-slate-700 bg-slate-950/40 flex flex-col items-center min-w-[140px]">
                          <div className="text-xs text-slate-500 font-medium mb-1">目標產物 Target</div>
                          <div className="font-bold text-slate-400 text-sm">{currentLevel.target.name.split(' ')[0]}</div>
                          <div className="font-mono text-xs text-slate-500 mt-0.5">{currentLevel.target.formula}</div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* SELECTION GRID */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  
                  {/* Reagents Selection */}
                  <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                    <h3 className="font-bold text-slate-200 text-sm mb-3">1. 選擇下一步反應試劑及條件</h3>
                    <div className="grid grid-cols-1 gap-2 max-h-[220px] overflow-y-auto pr-1">
                      {REAGENTS.map(r => {
                        const isSelected = selectedReagent?.id === r.id;
                        return (
                          <button
                            key={r.id}
                            onClick={() => { sounds.playClick(); setSelectedReagent(r); }}
                            className={`p-2.5 rounded-xl text-left border text-xs sm:text-sm font-mono transition-all flex items-center justify-between ${
                              isSelected
                                ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300 font-semibold'
                                : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                            }`}
                          >
                            <span>{r.label}</span>
                            {isSelected && <span className="text-emerald-400">✓</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Reaction Type Selection */}
                  <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                    <h3 className="font-bold text-slate-200 text-sm mb-3">2. 判斷反應類別 (Type of Reaction)</h3>
                    <div className="grid grid-cols-2 gap-2 max-h-[220px] overflow-y-auto pr-1">
                      {REACTION_TYPES.map(rt => {
                        const isSelected = selectedReactionType === rt.id;
                        return (
                          <button
                            key={rt.id}
                            onClick={() => { sounds.playClick(); setSelectedReactionType(rt.id); }}
                            className={`p-2.5 rounded-xl text-left border text-xs sm:text-sm transition-all flex items-center justify-between ${
                              isSelected
                                ? 'bg-teal-500/10 border-teal-500 text-teal-300 font-semibold'
                                : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                            }`}
                          >
                            <span className="truncate">{rt.name}</span>
                            {isSelected && <span className="text-teal-400">✓</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                </div>

                {/* Execute Button */}
                <div className="flex justify-end">
                  <button
                    onClick={handleExecuteReaction}
                    className="w-full sm:w-auto px-6 py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg transition-all"
                  >
                    ✨ {reactionHistory.length > 1 ? `執行第 ${reactionHistory.length} 步反應` : '執行化學反應'}
                  </button>
                </div>

                {/* Feedback Box */}
                {feedback && (
                  <div className={`p-4 rounded-xl border text-sm transition-all ${
                    feedback.type === 'success' || feedback.type === 'level_complete' ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-200' :
                    feedback.type === 'warning' ? 'bg-amber-950/30 border-amber-500/40 text-amber-200' :
                    'bg-red-950/30 border-red-500/40 text-red-200'
                  }`}>
                    <div className="font-bold mb-0.5">{feedback.title}</div>
                    <div className="text-xs leading-relaxed opacity-90">{feedback.msg}</div>
                  </div>
                )}

              </div>
            )}

            {/* GAME OVER & SOLUTION REVEAL */}
            {gameState === 'gameover' && currentLevel && (
              <div className="my-auto space-y-6 max-w-2xl mx-auto py-6">
                <div className="text-center space-y-2">
                  <div className="inline-block p-3 bg-red-500/10 border border-red-500/30 rounded-full text-red-400 mb-1 text-2xl">
                    ❌
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">挑戰失敗 / 實驗中斷</h2>
                  <p className="text-red-300 text-xs sm:text-sm font-medium">{failedReason}</p>
                </div>

                {/* SOLUTION PANEL */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4">
                  <h3 className="font-bold text-teal-400 text-sm sm:text-base border-b border-slate-800 pb-2">
                    📖 關卡標準答案與步驟拆解 ({currentLevel.title})
                  </h3>

                  <div className="space-y-3">
                    {currentLevel.fullSolutionSteps.map((s, idx) => (
                      <div key={idx} className="bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-emerald-400">步驟 {s.step}</span>
                          <span className="text-slate-400 bg-slate-900 border border-slate-800 px-2 py-0.5 rounded font-mono">
                            {s.type}
                          </span>
                        </div>
                        <div className="flex items-center space-x-2 text-slate-200 font-medium">
                          <span>{s.from.name}</span>
                          <span className="text-emerald-500 font-bold">➔</span>
                          <span className="text-teal-300">{s.to.name}</span>
                        </div>
                        <div className="text-slate-300 font-mono bg-slate-900/60 p-2 rounded border border-slate-800/80">
                          所需試劑：{s.reagent}
                        </div>
                        <div className="text-slate-400 italic text-[11px]">DSE 考點解說：{s.note}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <button
                  onClick={startGame}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-colors"
                >
                  🔄 重新挑戰本關
                </button>
              </div>
            )}

            {/* VICTORY STATE */}
            {gameState === 'victory' && (
              <div className="my-auto text-center space-y-6 max-w-md mx-auto py-8">
                <div className="text-5xl mb-2">🏆</div>
                <h2 className="text-3xl font-bold text-white">恭喜！榮獲「頂級有機煉金術師」</h2>
                <p className="text-slate-400 text-sm">你已完美通關所有 HKDSE 有機合成難題，對官能基轉化與考點陷阱掌握透徹！</p>
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center">
                  <div className="text-xs text-slate-400">總得分 (Total Score)</div>
                  <div className="text-4xl font-bold text-emerald-400 font-mono mt-1">{score}</div>
                </div>
                <button
                  onClick={startGame}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-colors"
                >
                  🔄 再玩一次
                </button>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-900/50 py-3 text-center text-xs text-slate-500">
            HKDSE 化學科 (Chemistry Topic XI) 有機化學小遊戲 · Single HTML File Version
          </footer>

          {/* CHEAT SHEET MODAL */}
          {showCheatSheet && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
                  <span className="text-emerald-400 font-bold">📖 HKDSE 有機反應速查手冊</span>
                  <button onClick={() => setShowCheatSheet(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="p-4 overflow-y-auto space-y-6 text-xs sm:text-sm">
                  {CHEAT_SHEET_DATA.map((sec, idx) => (
                    <div key={idx} className="space-y-2">
                      <h4 className="font-bold text-teal-300 text-sm border-b border-slate-800 pb-1">{sec.group}</h4>
                      <div className="space-y-2">
                        {sec.reactions.map((r, rIdx) => (
                          <div key={rIdx} className="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                            <div className="flex items-center justify-between font-semibold text-slate-200">
                              <span>{r.from} ➔ {r.to}</span>
                              <span className="text-emerald-400 text-xs bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded">{r.type}</span>
                            </div>
                            <div className="text-slate-300 font-mono text-xs">試劑：{r.reagent}</div>
                            <div className="text-slate-400 text-xs italic">{r.note}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
